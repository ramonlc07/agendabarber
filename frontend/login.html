<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Barbearia</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="container text-center py-2">
      <h1 class="display-6 mb-1">Login</h1>
      <p class="mb-0">
        Entre para acessar sua área no sistema da barbearia.
      </p>
    </div>
  </header>

  <main class="container py-5">
    <section class="row justify-content-center">
      <div class="col-12 col-md-7 col-lg-5">
        <div class="card p-4">
          <div class="text-center mb-4">
            <h2 class="h4 mb-1">Acesso ao sistema</h2>
            <p class="mb-0">Informe seus dados para continuar.</p>
          </div>

          <form id="form-login">
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input type="email" class="form-control" id="email" required>
            </div>

            <div class="mb-3">
              <label for="senha" class="form-label">Senha</label>
              <input type="password" class="form-control" id="senha" required>
            </div>

            <button type="submit" class="btn btn-primary w-100" id="btn-entrar">
              Entrar
            </button>
          </form>

          <p class="text-center mt-3 mb-0">
            Ainda não tem conta?
            <a href="cadastro.html" id="link-cadastro">Cadastre-se</a>
          </p>
        </div>
      </div>
    </section>
  </main>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
  ></script>
  <script src="script.js"></script>
</body>
</html>
