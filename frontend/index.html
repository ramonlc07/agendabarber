<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barbearia - Agendamentos</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="container text-center py-2">
      <h1 class="display-6 mb-1">Sistema da Barbearia</h1>
      <p class="mb-0">
        Plataforma simples para organizar serviços, profissionais e horários.
      </p>
    </div>
  </header>

  <main class="container py-5">
    <section class="row justify-content-center">
      <div class="col-12 col-md-9 col-lg-7">
        <div class="card p-4 text-center">
          <p class="text-uppercase small fw-bold mb-2">Barbearia profissional</p>
          <h2 class="h3 mb-3">Agende seu atendimento com facilidade</h2>
          <p class="mb-4">
            Escolha o serviço, veja os profissionais disponíveis e acompanhe
            seus agendamentos em um sistema claro e prático.
          </p>

          <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
            <a href="login.html" class="btn btn-primary">Entrar</a>
            <a href="cadastro.html" class="btn btn-outline-primary">Cadastrar</a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
  ></script>
</body>
</html>
