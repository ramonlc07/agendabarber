<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - Barbearia</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="container text-center py-2">
      <h1 class="display-6 mb-1">Cadastro</h1>
      <p class="mb-0">
        Crie sua conta para agendar serviços com praticidade.
      </p>
    </div>
  </header>

  <main class="container py-5">
    <section class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6">
        <div class="card p-4">
          <div class="text-center mb-4">
            <h2 class="h4 mb-1">Novo cliente</h2>
            <p class="mb-0">Preencha seus dados para começar.</p>
          </div>

          <form id="form-cadastro">
            <div class="mb-3">
              <label for="nome" class="form-label">Nome</label>
              <input type="text" class="form-control" id="nome" required>
            </div>

            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input type="email" class="form-control" id="email" required>
            </div>

            <div class="mb-3">
              <label for="senha" class="form-label">Senha</label>
              <input type="password" class="form-control" id="senha" required>
            </div>

            <div class="mb-3">
              <label for="telefone" class="form-label">Telefone</label>
              <input type="text" class="form-control" id="telefone" required>
            </div>

            <div class="mb-3">
              <label for="cpf" class="form-label">CPF</label>
              <input type="text" class="form-control" id="cpf" required>
            </div>

            <button type="submit" class="btn btn-primary w-100" id="btn-cadastrar">
              Cadastrar
            </button>
          </form>

          <p class="text-center mt-3 mb-0">
            Já tem conta?
            <a href="login.html" id="link-login">Entrar</a>
          </p>
        </div>
      </div>
    </section>
  </main>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
  ></script>
  <script src="script.js"></script>
</body>
</html>
